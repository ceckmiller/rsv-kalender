name: RSV-Kalender aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt

      - name: Kalender erzeugen
        run: |
          python update_calendars.py

      - name: Live-Daten in Netlify Blobs veröffentlichen
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -n "$NETLIFY_SITE_ID" ] && [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            npm install --omit=dev
            node scripts/publish-live-data.mjs
          else
            echo "Netlify-Secrets fehlen – Blobs-Update übersprungen."
          fi

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/ data/

          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Kalender automatisch aktualisiert"
            git push
          fi
