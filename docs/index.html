*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .25s,color .25s}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.app-header{background:linear-gradient(115deg,var(--header),var(--accent-2));color:var(--header-text);box-shadow:0 5px 18px rgba(0,0,0,.14)}html[data-theme="dark"] .app-header{background:linear-gradient(115deg,#080808,#17130a)}.header-inner{min-height:104px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{display:flex;align-items:center;gap:15px;min-width:0}.brand-logo-shell,.club-logo-shell{display:grid;place-items:center;background:#fff;border-radius:12px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.14)}.brand-logo{width:76px;height:52px;object-fit:contain}.brand h1{font-size:clamp(1.25rem,2.3vw,2rem);margin:0;font-weight:900;letter-spacing:.01em}.brand p{margin:4px 0 0;opacity:.88;font-weight:650}.top-actions{display:flex;align-items:center;gap:14px}.nav-btn{color:inherit;text-decoration:none;font-weight:850;padding:14px 4px;border-bottom:3px solid transparent;white-space:nowrap}.nav-btn.active{border-color:currentColor}.theme-control{display:flex;align-items:center;gap:8px}.theme-icon{font-size:1.15rem}.switch{width:48px;height:26px;border:1px solid currentColor;border-radius:99px;padding:2px;background:rgba(255,255,255,.24);cursor:pointer;position:relative}.switch::after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s}.switch[aria-checked="true"]::after{transform:translateX(21px);background:var(--accent)}.main{padding:30px 0 44px}.tabs{display:flex;gap:10px;margin-bottom:26px}.tab{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);padding:11px 17px;font:inherit;font-weight:850;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}html[data-theme="dark"] .tab.active{color:#080808}.panel[hidden]{display:none}.section-title{font-size:clamp(1.7rem,3vw,2.5rem);margin:0 0 24px;padding-bottom:14px;border-bottom:2px solid var(--accent);color:var(--text)}.team-switch{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin-bottom:22px}.team-switch button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:10px 15px;font:inherit;font-weight:800}.team-switch button.active{background:var(--accent);color:#fff;border-color:var(--accent)}html[data-theme="dark"] .team-switch button.active{color:#080808}.calendar-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.calendar-card,.upcoming,.match,.table-wrap{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.calendar-card{border-radius:18px;padding:22px}.calendar-card h2{margin:0 0 7px}.sub,.meta{color:var(--muted)}.buttons{display:grid;gap:9px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text);font-weight:800;background:var(--card)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}html[data-theme="dark"] .btn.primary{color:#080808}.match-list{display:grid;gap:12px}.match{border-radius:11px;overflow:hidden}.match summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff;font-weight:750}.match summary::-webkit-details-marker{display:none}html[data-theme="dark"] .match summary{background:linear-gradient(90deg,#12100a,#1c1608);color:var(--accent);border-bottom:1px solid var(--line)}.match-summary-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 11px;flex:1}.md{font-weight:950}.dot{opacity:.75}.chevron{font-size:1.5rem;line-height:1;transition:transform .2s}.match[open] .chevron{transform:rotate(180deg)}.match-center{padding:35px 30px 26px;text-align:center}.scoreboard{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,.62fr) minmax(150px,1fr);align-items:start;gap:20px}.team-block{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:1.12rem;font-weight:900}.club-logo-shell{width:132px;height:112px}.team-logo{max-width:112px;max-height:92px;object-fit:contain}.score-block{padding-top:22px}.final-score{font-size:clamp(3.5rem,8vw,5.7rem);font-weight:950;color:var(--score);letter-spacing:-.06em;line-height:.95;font-variant-numeric:tabular-nums}.half-score{font-size:1.4rem;color:var(--muted);font-weight:850;margin-top:10px}.goal-timeline{width:min(670px,100%);margin:18px auto 5px;display:grid;gap:7px}.goal-row{display:grid;grid-template-columns:minmax(0,1fr) 56px 66px 56px minmax(0,1fr);align-items:center;min-height:30px;font-variant-numeric:tabular-nums}.goal-score{grid-column:3;font-weight:950;font-size:1.25rem;color:var(--score);text-align:center}.goal-home{grid-column:1;text-align:right}.goal-home-minute{grid-column:2;text-align:right;color:var(--muted);padding-right:8px}.goal-away-minute{grid-column:4;text-align:left;color:var(--muted);padding-left:8px}.goal-away{grid-column:5;text-align:left}.halftime-separator{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:min(660px,100%);margin:12px auto 2px;color:var(--muted);font-weight:800}.halftime-separator::before,.halftime-separator::after{content:"";height:1px;background:var(--line)}.match-info{display:flex;justify-content:center;gap:80px;padding:24px 0 22px;border-bottom:1px solid var(--line);margin-top:10px}.info-item{display:grid;grid-template-columns:auto auto;column-gap:10px;text-align:left;align-items:start}.info-icon{font-size:1.6rem;color:var(--accent);grid-row:1/3}.info-label{font-weight:900}.info-value{margin-top:3px;color:var(--muted)}.report-links{display:flex;justify-content:center;gap:70px;padding-top:24px}.report-card{display:grid;grid-template-columns:auto auto;text-align:left;column-gap:12px;align-items:center;text-decoration:none;color:var(--link)}.report-icon{font-size:2rem}.report-title{font-weight:900}.report-sub{color:var(--muted);margin-top:4px}.block-title{font-size:1.55rem;margin:30px 0 13px}.upcoming-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.upcoming{border-radius:14px;padding:18px}.pairing{display:grid;gap:4px;margin:10px 0;font-weight:850}.pairing-team{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:8px}.club-logo{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:5px;padding:2px}.table-wrap{overflow:auto;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}th{background:var(--accent-soft)}.table-team{display:flex;align-items:center;gap:8px}.empty{padding:23px;text-align:center;border:1px dashed var(--line);border-radius:13px;color:var(--muted);background:var(--card)}footer{background:var(--header);color:var(--header-text);text-align:center;padding:26px 0 30px}html[data-theme="dark"] footer{background:#080808;color:var(--accent)}.footer-logo-shell{display:inline-grid;place-items:center;background:#fff;border-radius:10px;padding:6px}.footer-logo{width:72px;height:48px;object-fit:contain}.footer-name{font-weight:950;margin-top:9px}.footer-tag{opacity:.82;font-size:.9rem;margin-top:4px}.toast{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:30}

.match .match-center{transform-origin:top;will-change:opacity,transform}.match[open] .match-center{animation:matchReveal .28s ease-out both}.match summary:hover{filter:brightness(1.045)}.match summary:active{transform:scale(.998)}.match summary,.btn,.tab,.team-switch button,.upcoming{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease,background .25s,color .25s}.btn:hover,.tab:hover,.team-switch button:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(0,0,0,.10)}.upcoming:hover{transform:translateY(-2px)}@keyframes matchReveal{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.fixture-type{font-weight:900}.fixture-sub{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}.upcoming-actions{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;margin-top:13px}.mini-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--link);text-decoration:none;font-weight:800;font-size:.88rem;background:var(--card)}.weather-line{margin:10px 0 0}.auto-logo{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--accent);color:#fff;font-size:.62rem;font-weight:950;line-height:1}.club-logo-shell .auto-logo{width:100%;height:100%;font-size:1.4rem;border-radius:8px}html[data-theme="dark"] .auto-logo{color:#080808}
@media(max-width:830px){.header-inner{padding:14px 0;min-height:auto;align-items:flex-start}.brand-logo{width:62px}.brand p{display:none}.top-actions{gap:7px;flex-wrap:wrap;justify-content:flex-end}.nav-btn{font-size:.78rem;padding:9px 2px}.calendar-grid,.upcoming-grid{grid-template-columns:1fr}.scoreboard{grid-template-columns:1fr 120px 1fr;gap:8px}.club-logo-shell{width:92px;height:82px}.team-logo{max-width:78px;max-height:68px}.team-block{font-size:.9rem}.score-block{padding-top:18px}.goal-row{grid-template-columns:minmax(0,1fr) 42px 54px 42px minmax(0,1fr);font-size:.82rem}.goal-score{font-size:1.02rem}.match-info,.report-links{gap:18px;flex-direction:column;align-items:center}.match-center{padding:26px 14px}.report-card,.info-item{width:min(300px,100%)}.match summary{padding:13px 14px}.dot{display:none}.match-summary-line{gap:4px 8px}}
</style></head>
<body>
<header class="app-header"><div class="wrap header-inner"><div class="brand"><span class="brand-logo-shell"><img class="brand-logo" src="assets/rsv-logo.png" alt="RSV Eintracht 1949"></span><div><h1>RSV EINTRACHT 1949</h1><p>SPIELTAGE, TABELLEN & KALENDER</p></div></div><div class="top-actions"><a class="nav-btn" href="#calendar" data-nav="calendar">▣ KALENDER ABONNIEREN</a><a class="nav-btn active" href="#matchdays" data-nav="matchdays">♜ SPIELTAGE & TABELLEN</a><div class="theme-control"><span class="theme-icon" id="theme-icon">☀</span><button class="switch" id="theme-toggle" type="button" role="switch" aria-label="Tag- und Nachtmodus wechseln" aria-checked="false"></button></div></div></div></header>
<main class="wrap main">
<div class="tabs"><button class="tab" data-panel="calendar">Kalender abonnieren</button><button class="tab active" data-panel="matchdays">Spieltage & Tabellen</button></div>
<section id="calendar" class="panel" hidden><h2 class="section-title">Kalender abonnieren</h2><div id="calendar-cards" class="calendar-grid"></div></section>
<section id="matchdays" class="panel"><h2 class="section-title">Spieltage & Tabellen</h2><div class="team-switch"><button class="active" data-team="regionalliga">1. Herren</button><button data-team="u23">2. Herren (U23)</button><button data-team="u21">3. Herren (U21)</button></div><h3 class="block-title">Nächste Spiele</h3><div id="upcoming" class="upcoming-grid"></div><h3 class="block-title">Absolvierte Spieltage</h3><div id="matches" class="match-list"></div><h3 id="table-title" class="block-title">Tabelle</h3><p id="table-status" class="sub"></p><div id="table"></div><h3 class="block-title">Alle Spieltermine</h3><div id="fixtures"></div></section>
</main><footer><span class="footer-logo-shell"><img class="footer-logo" src="assets/rsv-logo.png" alt=""></span><div class="footer-name">RSV EINTRACHT 1949</div><div class="footer-tag">TRADITION. LEIDENSCHAFT. REGION.</div></footer><div id="toast" class="toast"></div>
<script>
const state={data:null,team:'regionalliga'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=v=>{if(!v)return'';const d=new Date(v+'T12:00:00');return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(d)};
function initials(name){return String(name||'?').replace(/\b(?:FC|SV|FSV|BFC|VSG|RSV|e\.V\.)\b/gi,' ').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function logoImg(name,logo,cls='club-logo'){const site=state.data?.club_websites?.[name]||'';let fallback='';try{fallback=site?`https://www.google.com/s2/favicons?domain=${encodeURIComponent(new URL(site).hostname)}&sz=256`:''}catch{};if(!logo&&!fallback)return `<span class="auto-logo">${esc(initials(name))}</span>`;return `<img class="${cls}" src="${esc(logo||fallback)}" data-fallback="${esc(fallback)}" data-initials="${esc(initials(name))}" alt="Logo ${esc(name)}" loading="lazy">`}
function teamLine(name,logo){return `<span class="pairing-team">${logoImg(name,logo)}<span>${esc(name)}</span></span>`}
function pairingHtml(m){return `<span class="pairing">${teamLine(m.home,m.home_logo)}${teamLine(m.away,m.away_logo)}</span>`}
function parseGoal(raw){const s=String(raw||'');const minute=(s.match(/(\d+)\.?\s*(?:Minute|min\.)?/i)||[])[1]||'';const score=(s.match(/(\d+\s*:\s*\d+)/)||[])[1]?.replace(/\s/g,'')||'';let name=s.replace(/\d+\.?\s*(?:Minute|min\.)?\s*[–-]?\s*/i,'').replace(/\s*[–-]\s*\d+\s*:\s*\d+\s*$/,'').trim();const team=(name.match(/\(([^)]+)\)\s*$/)||[])[1]||'';name=name.replace(/\s*\([^)]+\)\s*$/,'').trim();return{minute,score,name,team}}
function goalTimeline(m){const goals=(m.scorers||[]).map(parseGoal).filter(g=>g.score).reverse();if(!goals.length)return'';return `<div class="goal-timeline">${goals.map(g=>{const home=g.team===m.home||(!g.team&&Number(g.score.split(':')[0])>0);const away=g.team===m.away;return `<div class="goal-row">${home?`<span class="goal-home">${esc(g.name)}</span><span class="goal-home-minute">${esc(g.minute)}′</span>`:''}<span class="goal-score">${esc(g.score)}</span>${away?`<span class="goal-away-minute">${esc(g.minute)}′</span><span class="goal-away">${esc(g.name)}</span>`:''}</div>`}).join('')}</div>`}
function matchCard(m,i){const half=m.halftime_result||m.halftime||'';return `<details class="match" ${i===0?'open':''}><summary><span class="match-summary-line"><span class="md">${esc(m.matchday)}. Spieltag</span><span class="dot">•</span><span>${esc(String(m.competition||'').replace(/\s+20\d{2}\/\d{2}$/,''))}</span><span class="dot">•</span><span>${esc(formatDate(m.date))}</span><span class="dot">•</span><span>${esc(m.time||'')} Uhr</span></span><span class="chevron">⌄</span></summary><div class="match-center"><div class="scoreboard"><div class="team-block"><span class="club-logo-shell">${logoImg(m.home,m.home_logo,'team-logo')}</span><span>${esc(m.home)}</span></div><div class="score-block"><div class="final-score">${esc(m.result)}</div>${half?`<div class="half-score">(${esc(half)})</div>`:''}</div><div class="team-block"><span class="club-logo-shell">${logoImg(m.away,m.away_logo,'team-logo')}</span><span>${esc(m.away)}</span></div></div>${goalTimeline(m)}${half?`<div class="halftime-separator"><span>Halbzeit: ${esc(half)}</span></div>`:''}<div class="match-info">${m.attendance?`<div class="info-item"><span class="info-icon">♙</span><span class="info-label">Zuschauer</span><span class="info-value">${esc(m.attendance)}</span></div>`:''}${m.referee?`<div class="info-item"><span class="info-icon">⌁</span><span class="info-label">Schiedsrichter</span><span class="info-value">${esc(m.referee)}</span></div>`:''}</div><div class="report-links">${m.youtube_url?`<a class="report-card" href="${esc(m.youtube_url)}" target="_blank" rel="noopener"><span class="report-icon">▻</span><span><span class="report-title">OSTSPORT-Beitrag</span><span class="report-sub">Zum Beitrag auf ostsport.tv ↗</span></span></a>`:''}${m.report_url?`<a class="report-card" href="${esc(m.report_url)}" target="_blank" rel="noopener"><span class="report-icon">▤</span><span><span class="report-title">Offizieller Spielbericht (DFB)</span><span class="report-sub">Zum Spielbericht auf fussball.de ↗</span></span></a>`:''}</div></div></details>`}
function typeLabel(m){const comp=String(m.competition||'').replace(/\s+20\d{2}\/\d{2}$/,'');if(/freundschaft|testspiel/i.test(comp))return 'Freundschaftsspiel';if(/pokal/i.test(comp))return comp||'Pokal';return m.matchday?`${m.matchday}. Spieltag`:comp||'Spiel'}
function upcomingCard(m,label){if(!m)return'';const weather=m.weather?`${m.weather.summary||''}${m.weather.tmax!=null?` · ${m.weather.tmin??'–'}–${m.weather.tmax} °C`:''}${m.weather.rain!=null?` · Regen ${m.weather.rain} %`:''}`:'Prognose folgt, sobald der Termin im Vorhersagezeitraum liegt';return `<article class="upcoming"><strong>${esc(label)}</strong><div class="meta">${esc(typeLabel(m))} · ${esc(m.competition||'')}</div>${pairingHtml(m)}<div><strong>${esc(formatDate(m.date))}</strong>${m.time?` · ${esc(m.time)} Uhr`:''}</div><p class="meta weather-line">🌦️ ${esc(weather)}</p><div class="upcoming-actions">${m.maps_url?`<a class="mini-link" href="${esc(m.maps_url)}" target="_blank" rel="noopener">📍 Google Maps</a>`:''}${m.weather_url?`<a class="mini-link" href="${esc(m.weather_url)}" target="_blank" rel="noopener">🌤 Wetter öffnen</a>`:''}</div></article>`}
function render(){if(!state.data)return;const team=state.data.teams[state.team]||{matches:[],fixtures:[]};let cards=upcomingCard(team.next_game,'Nächstes Spiel');if(team.next_home)cards+=upcomingCard(team.next_home,'Nächstes Heimspiel');document.querySelector('#upcoming').innerHTML=cards||'<div class="empty">Noch kein kommendes Ligaspiel hinterlegt.</div>';document.querySelector('#matches').innerHTML=team.matches?.length?team.matches.map(matchCard).join(''):'<div class="empty">Noch keine absolvierten Ligaspiele hinterlegt.</div>';const table=(state.data.tables||{})[state.team]||{rows:[]};document.querySelector('#table-title').textContent=`Tabelle ${table.competition||team.competition||''}`.trim();document.querySelector('#table-status').textContent=table.updated_at||'';document.querySelector('#table').innerHTML=table.rows?.length?`<div class="table-wrap"><table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp.</th><th>S</th><th>U</th><th>N</th><th>Tore</th><th>Diff.</th><th>Pkt.</th></tr></thead><tbody>${table.rows.map(r=>`<tr${r.team==='RSV Eintracht 1949'?' style="font-weight:900;background:var(--accent-soft)"':''}><td>${esc(r.position)}</td><td><span class="table-team">${logoImg(r.team,r.logo_url)}${esc(r.team)}</span></td><td>${esc(r.played)}</td><td>${esc(r.wins)}</td><td>${esc(r.draws)}</td><td>${esc(r.losses)}</td><td>${esc(r.goals)}</td><td>${esc(r.diff)}</td><td><strong>${esc(r.points)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Noch keine offizielle Tabelle hinterlegt.</div>';document.querySelector('#fixtures').innerHTML=team.fixtures?.length?`<div class="table-wrap"><table><thead><tr><th>Spieltag</th><th>Datum</th><th>Begegnung</th><th>Ergebnis</th></tr></thead><tbody>${team.fixtures.map(m=>`<tr><td><span class="fixture-type">${esc(typeLabel(m))}</span>${m.competition?`<span class="fixture-sub">${esc(m.competition)}</span>`:''}</td><td>${esc(formatDate(m.date))}${m.time?`<br><span class="meta">${esc(m.time)} Uhr</span>`:''}</td><td>${pairingHtml(m)}</td><td><strong>${esc(m.result||'–')}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Noch keine Spieltermine hinterlegt.</div>'}
function setPanel(name){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==name);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===name));history.replaceState(null,'','#'+name)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();setPanel(a.dataset.nav)});document.querySelectorAll('.team-switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.team-switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.team=b.dataset.team;render()});
const themeToggle=document.querySelector('#theme-toggle'),themeIcon=document.querySelector('#theme-icon'),themeMeta=document.querySelector('#theme-color');function applyTheme(theme){document.documentElement.dataset.theme=theme;const dark=theme==='dark';themeToggle.setAttribute('aria-checked',String(dark));themeIcon.textContent=dark?'☾':'☀';themeMeta.content=dark?'#080808':'#07529a';localStorage.setItem('rsv-theme',theme)}applyTheme(localStorage.getItem('rsv-theme')||'light');themeToggle.onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
const calendars=[['1. Herren','rsv-regionalliga.ics'],['2. Herren (U23)','rsv-u23.ics'],['3. Herren (U21)','rsv-u21.ics']];document.querySelector('#calendar-cards').innerHTML=calendars.map(([name,file])=>`<article class="calendar-card"><h2>${name}</h2><p class="sub">Diesen Mannschaftskalender abonnieren.</p><div class="buttons"><a class="btn primary" href="${file}">ICS öffnen</a><button class="btn" onclick="navigator.clipboard.writeText(new URL('${file}',location.href).href);showToast('Kalender-Link kopiert')">Link kopieren</button></div></article>`).join('');function showToast(t){const x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
document.addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.initials)return;const fb=img.dataset.fallback;if(fb&&img.src!==fb){img.src=fb;img.dataset.fallback='';return}const span=document.createElement('span');span.className='auto-logo';span.textContent=img.dataset.initials;img.replaceWith(span)},true);
fetch('site-data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{state.data=d;render()}).catch(()=>document.querySelector('#matches').innerHTML='<div class="empty">Spieldaten konnten gerade nicht geladen werden.</div>');setPanel(location.hash==='#calendar'?'calendar':'matchdays');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
