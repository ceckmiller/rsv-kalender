*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));transition:.25s}button,a{font:inherit}.wrap{width:min(980px,calc(100% - 24px));margin:auto}
header{background:linear-gradient(120deg,#07519a,#0879d2);color:#fff;padding:22px 0 26px}html[data-theme=dark] header{background:#080808;color:#d6ad35}.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{grid-column:2;text-align:center}.brand img{display:block;width:132px;height:88px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;margin:auto}.brand h1{font-size:clamp(1.18rem,3.8vw,1.55rem);font-weight:650;letter-spacing:.005em;margin:12px 0 0;white-space:nowrap}.theme{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px}.toggle{width:52px;height:29px;border:1.5px solid currentColor;border-radius:99px;background:rgba(255,255,255,.22);padding:3px;cursor:pointer}.toggle:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.22s}.toggle[aria-checked=true]:after{transform:translateX(23px);background:#d6ad35}
main{padding:18px 0 30px}.view[hidden]{display:none}.team-tabs{display:flex;gap:8px;overflow:auto;margin:2px 0 16px;padding-bottom:4px}.team-tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:600}.team-tabs .active{background:var(--blue);color:#fff;border-color:var(--blue)}html[data-theme=dark] .team-tabs .active{color:#090909}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}.card-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:14px 18px 11px;border-bottom:1px solid var(--line);font-size:.91rem;font-weight:650;color:var(--blue)}.card-head>span:first-child{justify-self:start}.card-head small{justify-self:end;font-weight:500;color:var(--muted);text-align:right}.countdown{justify-self:center;display:flex;align-items:center;gap:4px;white-space:nowrap}.countbox{min-width:29px;padding:3px 4px 2px;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--card) 86%,var(--blue) 14%);text-align:center}.countbox b{display:block;font-size:.7rem;line-height:1;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}.countbox em{display:block;margin-top:2px;font-size:.43rem;line-height:1;font-style:normal;font-weight:550;color:var(--muted);letter-spacing:.03em}.count-live{font-size:.68rem;font-weight:700;color:var(--blue)}

.section-title{margin:24px 5px 10px;color:var(--blue);font-size:1rem;font-weight:700}.compact{padding:0 14px}.row{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr) 18px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rteam{display:flex;align-items:center;gap:7px;min-width:0;font-size:.78rem;font-weight:520}.rteam.away{justify-content:flex-end;text-align:right}.rteam img,.tiny-logo{width:30px;height:27px;object-fit:contain;background:#fff;border-radius:5px;padding:2px;flex:none}.rscore{text-align:center;font-size:1.05rem;font-weight:650;font-variant-numeric:tabular-nums}.rhalf{font-size:.68rem;color:var(--muted);margin-top:2px}.rmeta{display:block;color:var(--muted);font-size:.67rem;margin-bottom:3px;font-weight:450}.chev{color:var(--blue);font-size:1.35rem}
.tablebox{overflow:hidden}.tablebox table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:.73rem}.tablebox th,.tablebox td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.tablebox th{color:var(--muted);font-weight:550}.tablebox th:nth-child(1),.tablebox td:nth-child(1){width:30px}.tablebox th:nth-child(2),.tablebox td:nth-child(2){width:auto;text-align:left}.tablebox th:nth-child(n+3),.tablebox td:nth-child(n+3){width:43px}.tableteam{display:flex;align-items:center;gap:3px;min-width:0}.tableteam .tiny-logo{margin:0}.tableteam-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}html[data-theme=dark] .tablebox td:last-child b,html[data-theme=dark] .gs,html[data-theme=dark] .result,html[data-theme=dark] .rscore{color:#e6c256}.fixtures .row{grid-template-columns:95px minmax(0,1fr) 55px}.ftype{font-size:.72rem;font-weight:650}.fdate{font-size:.68rem;color:var(--muted);margin-top:3px}.pair{display:grid;gap:5px}.pair .rteam{font-size:.78rem}.empty{padding:22px;text-align:center;color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cal{padding:18px}.cal h2{font-size:1.05rem;margin:0 0 7px}.cal p{color:var(--muted);font-size:.82rem}.btn{display:block;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;text-decoration:none;color:var(--ink);font-weight:650;margin-top:8px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.site-footer{background:#0759a6;color:#fff;text-align:center;padding:25px 12px 30px}html[data-theme=dark] .site-footer{background:#0759a6;color:#fff}.site-footer img{width:76px;height:52px;object-fit:contain;background:#fff;border-radius:9px;padding:4px}.site-footer strong{display:block;margin-top:7px;font-weight:650}.site-footer span{font-size:.78rem;opacity:.88}
.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0759a6;color:#fff;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 -7px 20px rgba(0,0,0,.16);transition:.25s}html[data-theme=dark] .bottom-nav{background:#070707;color:#d6ad35;border-top:1px solid #3e3217}html[data-theme=dark] .navitem:not(.active){color:#d9d4c8}html[data-theme=dark] .navitem.active:before{background:#d6ad35}.navitem{border:0;background:transparent;color:inherit;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;font-size:.76rem;opacity:.78}.navitem b{display:grid;place-items:center}.navitem b svg{width:23px;height:23px;stroke-width:1.8}.navitem.active{opacity:1;font-weight:700}.navitem.active:before{content:"";position:absolute;top:0;width:56px;height:3px;background:#fff;border-radius:0 0 4px 4px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:99px;display:none;z-index:30;font-size:.8rem}
@media(max-width:700px){.wrap{width:min(100% - 16px,980px)}header{padding:16px 0 20px}.brand img{width:105px;height:70px}.brand h1{font-size:1.05rem;font-weight:520}.theme{gap:4px}.theme>span{font-size:.95rem}.card-head{grid-template-columns:minmax(0,1fr) auto minmax(0,.72fr);padding-left:13px;padding-right:13px;font-size:.76rem;gap:5px}.card-head small{font-size:.62rem}.countbox{min-width:25px;padding:3px 3px 2px}.countbox b{font-size:.62rem}.countbox em{font-size:.39rem}.match-grid{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:5px}.side img,.logo-fallback{width:58px;height:49px}.kickoff{font-size:1.78rem}.details{grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible}.detail{min-width:0;padding:12px 3px}.dval{font-size:.7rem;overflow-wrap:anywhere}.dlab{font-size:.6rem}.calendar-grid{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr) 12px}.rteam{font-size:.68rem;line-height:1.17}.goal{grid-template-columns:minmax(0,1fr) 35px 45px 35px minmax(0,1fr);font-size:.66rem}.gs{font-size:.82rem}.tablebox table{font-size:.66rem}.tablebox th,.tablebox td{padding:7px 3px}.tablebox th:nth-child(1),.tablebox td:nth-child(1){width:25px}.tablebox th:nth-child(n+3),.tablebox td:nth-child(n+3){width:35px}.tiny-logo{width:24px;height:23px}}
</style></head>
<body>
<header><div class="wrap head"><div class="brand"><img src="assets/rsv-logo.png" alt="RSV Eintracht 1949"><h1>RSV Eintracht 1949</h1></div><div class="theme"><span>☀</span><button id="theme" class="toggle" aria-label="Tag- und Nachtmodus" aria-checked="false"></button><span>☾</span></div></div></header>
<main class="wrap"><section id="matches-view" class="view"><div class="team-tabs"><button class="active" data-team="regionalliga">1. Herren</button><button data-team="u23">U23</button><button data-team="u21">U21</button><button data-team="u19">U19</button></div><div id="app"></div></section><section id="calendar-view" class="view" hidden><div class="section-title">KALENDER ABONNIEREN</div><div id="calendars" class="calendar-grid"></div></section></main>
<footer class="site-footer"><img src="assets/rsv-logo.png" alt="RSV"><strong>RSV Eintracht 1949</strong><span>TRADITION. LEIDENSCHAFT. REGION.</span></footer>
<nav class="bottom-nav"><button class="navitem active" data-view="matches-view"><b data-nav-icon="ball"></b>Spieltage &amp; Tabellen</button><button class="navitem" data-view="calendar-view"><b data-nav-icon="calendar"></b>Kalender abonnieren</button></nav><div id="toast" class="toast"></div>
<script>
const S={data:null,team:'regionalliga'};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>{if(!d)return'';return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))};
const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
function logo(n,u,cls=''){return u?`<img class="${cls}" src="${e(u)}" alt="Logo ${e(n)}" loading="lazy" onerror="this.outerHTML='<span class=\'logo-fallback ${cls}\'>${e(initials(n))}</span>'">`:`<span class="logo-fallback ${cls}">${e(initials(n))}</span>`}
function type(m){let c=String(m.competition||'').replace(/\s+20\d{2}\/\d{2}$/,'');if(/freundschaft|test/i.test(c))return'Freundschaftsspiel';if(/pokal/i.test(c))return c;if(m.matchday)return`${m.matchday}. Spieltag`;return c||'Spiel'}
const icons={
users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
whistle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 6.5 22 3"/><path d="m8.5 14.5 7.8-7.8a2.4 2.4 0 0 0-3.4-3.4L5.1 11.1"/><circle cx="6.5" cy="15.5" r="4.5"/><path d="M11 15.5h4.5a3.5 3.5 0 0 0 0-7H14"/></svg>',
cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 1 1 0 9Z"/><path d="M12 2v2M4.93 4.93l1.42 1.42M2 12h2M19.07 4.93l-1.42 1.42"/></svg>',
play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></svg>',
file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>',
calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 3 2-1 4h-4L9 9l3-2ZM7 17l3-4M17 17l-3-4M5 10l4-1M19 10l-4-1"/></svg>'};
function icon(name){return icons[name]||''}document.querySelectorAll('[data-nav-icon]').forEach(x=>x.innerHTML=icon(x.dataset.navIcon));
function parseGoal(x){if(typeof x==='object')return x;let s=String(x||''),score=(s.match(/\d+\s*:\s*\d+/)||[''])[0].replace(/\s/g,''),minute=(s.match(/(\d+)\.?\s*(?:Min|Minute)?/i)||[])[1]||'',team=(s.match(/\(([^)]+)\)\s*$/)||[])[1]||'';let name=s.replace(/\d+\.?\s*(?:Min(?:ute)?\.?\s*)?[–-]?\s*/i,'').replace(/\s*[–-]\s*\d+\s*:\s*\d+.*/,'').replace(/\s*\([^)]+\)\s*$/,'').trim();return{score,minute,name,team}}
function goals(m){let a=(m.scorers||[]).map(parseGoal).filter(g=>g.score).reverse();return a.length?`<div class="goals">${a.map(g=>{let home=g.team===m.home||(!g.team&&g.side==='home'),away=g.team===m.away||g.side==='away';if(!home&&!away){let [h]=g.score.split(':').map(Number);let prev=a[a.indexOf(g)+1]?.score?.split(':').map(Number)||[0,0];home=h>(prev[0]||0);away=!home}return`<div class="goal">${home?`<span class="gh">${e(g.name)}</span><span class="ghm">${e(g.minute)}′</span>`:''}<span class="gs">${e(g.score)}</span>${away?`<span class="gam">${e(g.minute)}′</span><span class="ga">${e(g.name)}</span>`:''}</div>`}).join('')}</div>`:''}
function teamSide(n,u){return`<div class="side">${logo(n,u)}<div class="side-name">${e(n)}</div></div>`}
function nextCard(m){if(!m)return`<div class="card empty">Noch kein nächstes Spiel veröffentlicht.</div>`;return`<article class="card"><div class="card-head"><span>▣ &nbsp;NÄCHSTES SPIEL</span><span class="countdown" data-kickoff="${e(m.date)}T${e(m.time||'00:00')}:00"></span><small>${e(type(m))}</small></div><div class="hero"><div class="meta">${e(m.competition||'')} · ${e(type(m))}</div><div class="match-grid">${teamSide(m.home,m.home_logo)}<div><div class="date">${e(fd(m.date))}</div><div class="kickoff">${e(m.time||'–')}</div><div class="meta">Uhr</div></div>${teamSide(m.away,m.away_logo)}</div>${m.location?`<div class="venue">⌖ ${e(m.location)}</div>`:''}${m.weather_url?`<div class="weather-preview"><a class="weather-link" href="${e(m.weather_url)}" target="_blank" rel="noopener">${icon('cloud')} Wetter am Spielort öffnen</a></div>`:''}</div></article>`}
function detail(iconName,val,label,url){let tag=url?'a':'div';return`<${tag} class="detail"${url?` href="${e(url)}" target="_blank" rel="noopener"`:''}><span class="ico">${icon(iconName)}</span><div class="dval">${e(val||'–')}</div><div class="dlab">${e(label)}</div></${tag}>`}
function lastCard(m){if(!m)return'';return`<details class="card last" open><summary class="card-head"><span>⚽ &nbsp;LETZTES SPIEL</span><span class="arrow">⌃</span></summary><div class="last-body hero"><div class="meta">${e(m.competition||'')} · ${e(fd(m.date))}</div><div class="match-grid">${teamSide(m.home,m.home_logo)}<div><div class="result">${e(m.result)}</div>${m.halftime_result?`<div class="half">(${e(m.halftime_result)})</div>`:''}</div>${teamSide(m.away,m.away_logo)}</div>${goals(m)}<div class="details">${detail('users',m.attendance,'Zuschauer')}${detail('whistle',m.referee,'Schiedsrichter')}${detail('play','OSTSPORT','',m.youtube_url)}${detail('file','Spielbericht','',m.report_url)}</div></div></details>`}
function compactRow(m){return`<div class="row"><div><span class="rmeta">${e(type(m))} · ${e(fd(m.date))}</span><span class="rteam">${logo(m.home,m.home_logo)}<span>${e(m.home)}</span></span></div><div class="rscore">${e(m.result||'–')}${m.halftime_result?`<div class="rhalf">(${e(m.halftime_result)})</div>`:''}</div><div class="rteam away"><span>${e(m.away)}</span>${logo(m.away,m.away_logo)}</div><span class="chev">›</span></div>`}
function tableHtml(t){if(!t?.rows?.length)return`<div class="card empty">Die Tabelle wird vorbereitet.</div>`;return`<div class="card tablebox"><table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp.</th><th>Tore</th><th>Pkt.</th></tr></thead><tbody>${t.rows.map(r=>`<tr><td>${e(r.position)}</td><td><span class="tableteam">${logo(r.team,r.logo_url,'tiny-logo')}<span class="tableteam-name">${e(r.team)}</span></span></td><td>${e(r.played)}</td><td>${e(r.goals)}</td><td><b>${e(r.points)}</b></td></tr>`).join('')}</tbody></table></div>`}
function fixturesHtml(a){return`<div class="card compact fixtures">${a.map(m=>`<div class="row"><div><div class="ftype">${e(type(m))}</div><div class="fdate">${e(fd(m.date))}${m.time?` · ${e(m.time)} Uhr`:''}</div></div><div class="pair"><span class="rteam">${logo(m.home,m.home_logo)} ${e(m.home)}</span><span class="rteam">${logo(m.away,m.away_logo)} ${e(m.away)}</span></div><div class="rscore">${e(m.result||'–')}</div></div>`).join('')}</div>`}
function countMarkup(ms){if(ms<=0)return'<span class="count-live">ANSTOSS</span>';let sec=Math.floor(ms/1000),days=Math.floor(sec/86400),hours=Math.floor((sec%86400)/3600),mins=Math.floor((sec%3600)/60),secs=sec%60;const box=(v,l)=>`<span class="countbox"><b>${String(v).padStart(2,'0')}</b><em>${l}</em></span>`;if(days>7)return box(days,'TAGE');if(ms>=86400000)return box(days,'TAGE')+box(hours,'STD')+box(mins,'MIN');return box(Math.floor(sec/3600),'STD')+box(mins,'MIN')+box(secs,'SEK')}function updateCountdowns(){document.querySelectorAll('[data-kickoff]').forEach(x=>{let t=new Date(x.dataset.kickoff).getTime();x.innerHTML=countMarkup(t-Date.now())})}
function render(){let t=S.data.teams[S.team],done=[...(t.matches||[])].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),last=done[0],others=done.slice(1);document.querySelector('#app').innerHTML=nextCard(t.next_game)+lastCard(last)+`<h2 class="section-title">WEITERE SPIELE</h2><div class="card compact">${others.length?others.map(compactRow).join(''):'<div class="empty">Noch keine weiteren Ergebnisse.</div>'}</div><h2 class="section-title">TABELLE</h2>${tableHtml(S.data.tables?.[S.team])}<h2 class="section-title">ALLE SPIELTERMINE</h2>${fixturesHtml(t.fixtures||[])}`;updateCountdowns()}
document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-team]').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.team=b.dataset.team;render()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==b.dataset.view)});
const cals=[['1. Herren','rsv-regionalliga.ics'],['U23','rsv-u23.ics'],['U21','rsv-u21.ics'],['U19','rsv-u19.ics']];document.querySelector('#calendars').innerHTML=cals.map(([n,f])=>`<article class="card cal"><h2>${n}</h2><p>Spielplan automatisch im persönlichen Kalender aktuell halten.</p><a class="btn primary" href="${f}">Kalender öffnen</a><button class="btn" data-copy="${f}">Link kopieren</button></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(new URL(b.dataset.copy,location.href).href).then(()=>toast('Kalender-Link kopiert')));function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}
let tog=document.querySelector('#theme'),meta=document.querySelector('#theme-color');function setTheme(x){document.documentElement.dataset.theme=x;tog.setAttribute('aria-checked',x==='dark');meta.content=x==='dark'?'#080808':'#0759a6';localStorage.setItem('rsv-theme',x)}setTheme(localStorage.getItem('rsv-theme')||'light');tog.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setInterval(updateCountdowns,1000);fetch('/api/site-data',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).catch(()=>fetch('site-data.json',{cache:'no-store'}).then(r=>r.json())).then(d=>{S.data=d;render()}).catch(()=>document.querySelector('#app').innerHTML='<div class="card empty">Spieldaten konnten nicht geladen werden.</div>');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
