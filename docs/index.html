function type(m){let c=String(m.competition||'').replace(/\s+20\d{2}\/\d{2}$/,'');if(/freundschaft|test/i.test(c))return'Freundschaftsspiel';if(/pokal/i.test(c)){let r=String(m.round||'').trim();if(r&&!/^pokalrunde$/i.test(r))return r;let g=findRoundGroup(m);if(g?.round&&!/^pokalrunde$/i.test(g.round))return g.round;return c}if(m.matchday)return`${m.matchday}. Spieltag`;return c||'Spiel'}

function icon(name){return icons[name]||''}document.querySelectorAll('[data-nav-icon]').forEach(x=>x.innerHTML=icon(x.dataset.navIcon));
function parseGoal(x){if(typeof x==='object')return x;let s=String(x||''),score=(s.match(/\d+\s*:\s*\d+/)||[''])[0].replace(/\s/g,''),minute=(s.match(/(\d+)\.?\s*(?:Min|Minute)?/i)||[])[1]||'',team=(s.match(/\(([^)]+)\)\s*$/)||[])[1]||'';let name=s.replace(/\d+\.?\s*(?:Min(?:ute)?\.?\s*)?[–-]?\s*/i,'').replace(/\s*[–-]\s*\d+\s*:\s*\d+.*/,'').replace(/\s*\([^)]+\)\s*$/,'').trim();return{score,minute,name,team}}
function goals(m){let a=(m.scorers||[]).map(parseGoal).filter(g=>g.score).reverse();return a.length?`<div class="goals">${a.map(g=>{let home=g.team===m.home||(!g.team&&g.side==='home'),away=g.team===m.away||g.side==='away';if(!home&&!away){let [h]=g.score.split(':').map(Number);let prev=a[a.indexOf(g)+1]?.score?.split(':').map(Number)||[0,0];home=h>(prev[0]||0);away=!home}return`<div class="goal">${home?`<span class="gh">${e(g.name)}</span><span class="ghm">${e(g.minute)}′</span>`:''}<span class="gs">${e(g.score)}</span>${away?`<span class="gam">${e(g.minute)}′</span><span class="ga">${e(g.name)}</span>`:''}</div>`}).join('')}</div>`:''}
function teamSide(n,u,linked=true){return`<div class="side">${logo(n,u)}<div class="side-name">${linked?clubLink(n):e(n)}</div></div>`}
function venueParts(m){let raw=String(m.location||'').trim(),name='',address='';if(raw.includes(',')){let parts=raw.split(',').map(x=>x.trim());name=parts.shift();address=parts.join(', ').replace(/-Lankwitz\b/i,'').replace(/,\s*$/,'')}else{name=raw}return{name,address}}
function venueHtml(m,cls='venue'){if(!m?.location)return'';let v=venueParts(m),addr=v.address?`<span class="venue-line"><span class="venue-pin">${icon('pin')}</span><span class="venue-address">${e(v.address)}</span></span>`:'',inner=`<span class="venue-name">${e(v.name)}</span>${addr}`;return m.maps_url?`<a class="${cls}" href="${e(m.maps_url)}" target="_blank" rel="noopener" aria-label="Navigation zu ${e(v.name)}">${inner}</a>`:`<div class="${cls}">${inner}</div>`}
function matchActions(m){let home=S.team==='regionalliga'&&!m.result&&(m.is_home||m.home===ownTeamName());let ticket=home?`<a class="match-action primary" href="${e(m.ticket_url||TICKET_URL)}" target="_blank" rel="noopener">${icon('ticket')}<span>Tickets</span></a>`:'';let weather=m.weather_url?`<a class="match-action" href="${e(m.weather_url)}" target="_blank" rel="noopener">${icon('cloud')}<span>Wetter</span></a>`:'';return ticket||weather?`<div class="match-actions">${ticket}${weather}</div>`:''}
function matchCardContent(m,title='NÄCHSTES SPIEL',linked=true){return`<div class="card-head"><span>▣ &nbsp;${e(title)}</span><span class="countdown" data-kickoff="${e(m.date)}T${e(m.time||'00:00')}:00"></span><small>${e(type(m))}</small></div><div class="hero"><div class="meta">${e(m.competition||'')} · ${e(type(m))}</div><div class="match-grid">${teamSide(m.home,m.home_logo,linked)}<div><div class="date">${e(fd(m.date))}</div><div class="kickoff">${e(m.time||'–')}</div><div class="meta">Uhr</div></div>${teamSide(m.away,m.away_logo,linked)}</div>${venueHtml(m)}${matchActions(m)}</div>`}
function nextCard(m){if(!m)return`<div class="card empty">Noch kein nächstes Spiel veröffentlicht.</div>`;return`<article class="card">${matchCardContent(m,'NÄCHSTES SPIEL')}</article>`}
function detail(iconName,val,label,url){let tag=url?'a':'div';return`<${tag} class="detail"${url?` href="${e(url)}" target="_blank" rel="noopener"`:''}><span class="ico">${icon(iconName)}</span><div class="dval">${e(val||'–')}</div><div class="dlab">${e(label)}</div></${tag}>`}

function compactRow(m){return`<div class="row"><div><span class="rmeta">${e(type(m))} · ${e(fd(m.date))}</span><span class="rteam">${logo(m.home,m.home_logo)}${clubLink(m.home)}</span></div><div class="rscore">${e(m.result||'–')}${m.halftime_result?`<div class="rhalf">(${e(m.halftime_result)})</div>`:''}</div><div class="rteam away">${clubLink(m.away)}${logo(m.away,m.away_logo)}</div><span class="chev">›</span></div>`}
function tableHtml(t){if(!t?.rows?.length)return`<div class="card empty">Die Tabelle wird vorbereitet.</div>`;return`<div class="card tablebox"><table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp.</th><th>Tore</th><th>Pkt.</th></tr></thead><tbody>${t.rows.map(r=>`<tr><td>${e(r.position)}</td><td><span class="tableteam">${logo(r.team,r.logo_url,'tiny-logo')}<span class="tableteam-name">${clubLink(r.team)}</span></span></td><td>${e(r.played)}</td><td>${e(r.goals)}</td><td><b>${e(r.points)}</b></td></tr>`).join('')}</tbody></table></div>`}
function fixtureTeam(name,url){return`<span class="rteam">${logo(name,url)}<span>${e(name)}</span></span>`}
function enrichFixture(m){let played=(S.data?.teams?.[S.team]?.matches||[]).find(x=>(x.id&&m.id&&x.id===m.id)||(x.date===m.date&&x.home===m.home&&x.away===m.away));return played?{...m,...played,location:played.location||m.location,maps_url:played.maps_url||m.maps_url,weather_url:played.weather_url||m.weather_url,ticket_url:played.ticket_url||m.ticket_url}:m}
function completedFixtureContent(m){return`<div class="card-head"><span>⚽ &nbsp;ABSOLVIERTES SPIEL</span><small>${e(type(m))}</small></div><div class="last-body hero"><div class="meta">${e(m.competition||'')} · ${e(fd(m.date))}</div><div class="match-grid">${teamSide(m.home,m.home_logo,false)}<div><div class="result">${e(m.result||'–')}</div>${m.halftime_result?`<div class="half">(${e(m.halftime_result)})</div>`:''}</div>${teamSide(m.away,m.away_logo,false)}</div>${goals(m)}${venueHtml(m)}<div class="details">${detail('users',m.attendance,'Zuschauer')}${detail('whistle',m.referee,'Schiedsrichter')}${detail('play','OSTSPORT','',m.youtube_url)}${detail('file','Spielbericht','',m.report_url)}</div></div>`}
function fixtureSummary(m){let score=m.result?`${e(m.result)}${m.halftime_result?`<div class="rhalf">(${e(m.halftime_result)})</div>`:''}`:'– : –';return`<summary class="fixture-summary"><div class="fmeta"><div class="ftype" data-round-trigger role="button" tabindex="0">${e(type(m))}</div><div class="fdate">${e(fd(m.date))}${m.time?` · ${e(m.time)}`:''}</div><div class="fcomp">${e(m.competition||'')}</div></div><div class="pair"><span class="rteam">${logo(m.home,m.home_logo)}<span>${e(m.home||'')}</span></span><span class="rteam">${logo(m.away,m.away_logo)}<span>${e(m.away||'')}</span></span></div><div class="rscore">${score}</div><span class="fixture-chevron">›</span></summary>`}
function fixturesHtml(fixtures){let list=(fixtures||[]).map(enrichFixture);if(!list.length)return`<div class="card empty">Noch keine Spieltermine veröffentlicht.</div>`;return`<div class="fixtures">${list.map(m=>`<details class="card fixture-item${m.is_home||m.home===ownTeamName()?' is-home':''}" data-fixture-id="${e(m.id||'')}">${fixtureSummary(m)}<div class="fixture-expanded"></div></details>`).join('')}</div>`}
function ownTeamName(){return S.data?.teams?.[S.team]?.team_name||''}
function isOwnMatch(m){let t=ownTeamName();return m.home===t||m.away===t}
function findRoundGroup(m){let groups=S.data?.teams?.[S.team]?.round_groups||[];return groups.find(g=>(g.matches||[]).some(x=>x.id===m.id||(x.date===m.date&&x.home===m.home&&x.away===m.away)))||groups.find(g=>g.kind==='cup'&&m.round&&g.round===m.round&&(g.competition||'')===(m.competition||''))||groups.find(g=>String(g.round||'')===String(m.matchday||'')&&(g.competition||'')===(m.competition||''))||null}
function matchdayTitle(g){if(g?.kind==='league'&&g.round)return`${g.round}. Spieltag ${g.competition||''}`.trim();if(g?.kind==='cup'&&g.round)return`${g.round} – ${g.competition||''}`.trim();return g?.title||g?.competition||'Spieltag'}
function matchdayRow(raw){let m=enrichFixture(raw),own=isOwnMatch(m);return`<div class="round-match${own?' is-own':''}"><div class="home">${logo(m.home,m.home_logo)}<span>${e(m.home||'')}</span></div><div class="round-score">${m.result?e(m.result):`<span class="round-time">${e(m.time||'–')}</span>${m.date?`<span class="round-date">${e(fds(m.date))}</span>`:''}`}</div><div class="away">${logo(m.away,m.away_logo)}<span>${e(m.away||'')}</span></div></div>`}
function matchdayContent(g){let list=g?.matches||[];return`<div class="card-head"><span>▣ &nbsp;${e(matchdayTitle(g))}</span><small>${e(list.length)} Paarungen</small></div><div class="matchday-body">${list.map(matchdayRow).join('')||'<div class="empty">Für diesen Spieltag liegen noch keine Paarungen vor.</div>'}</div>`}
function fillFixtureExpanded(item,mode){let expanded=item.querySelector('.fixture-expanded'),m=(S.data?.teams?.[S.team]?.fixtures||[]).map(enrichFixture).find(x=>x.id===item.dataset.fixtureId);if(!expanded||!m)return;item.dataset.expandMode=mode;if(mode==='matchday'){let g=findRoundGroup(m);expanded.innerHTML=g?matchdayContent(g):`<div class="empty">Für diesen Spieltag liegen noch keine Paarungen vor.</div>`}else{expanded.innerHTML=m.result?completedFixtureContent(m):matchCardContent(m,'SPIELTERMIN',false);updateCountdowns()}}
function bindFixtureAccordions(){document.querySelectorAll('.fixture-item').forEach(item=>{item.addEventListener('toggle',()=>{if(!item.open){item.dataset.expandMode='';return}document.querySelectorAll('.fixture-item[open]').forEach(other=>{if(other!==item)other.open=false});if(item.dataset.expandMode!=='matchday')fillFixtureExpanded(item,'match')});item.querySelectorAll('[data-round-trigger]').forEach(trigger=>{let openRound=ev=>{ev.preventDefault();ev.stopPropagation();if(item.open&&item.dataset.expandMode==='matchday'){item.open=false;item.dataset.expandMode='';return}fillFixtureExpanded(item,'matchday');item.open=true};trigger.addEventListener('click',openRound,true);trigger.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openRound(ev)}})});item.querySelector('.fixture-expanded')?.addEventListener('click',ev=>{if(ev.target.closest('a,button'))return;item.open=false})})}
function countMarkup(ms){if(ms<=0)return'<span class="count-live">ANSTOSS</span>';let sec=Math.floor(ms/1000),days=Math.floor(sec/86400),hours=Math.floor((sec%86400)/3600),mins=Math.floor((sec%3600)/60),secs=sec%60;const box=(v,l)=>`<span class="countbox"><b>${String(v).padStart(2,'0')}</b><em>${l}</em></span>`;if(days>7)return box(days,'TAGE');if(ms>=86400000)return box(days,'TAGE')+box(hours,'STD')+box(mins,'MIN');return box(Math.floor(sec/3600),'STD')+box(mins,'MIN')+box(secs,'SEK')}function updateCountdowns(){document.querySelectorAll('[data-kickoff]').forEach(x=>{let t=new Date(x.dataset.kickoff).getTime();x.innerHTML=countMarkup(t-Date.now())})}
function render(){let t=S.data?.teams?.[S.team];if(!t){document.querySelector('#app').innerHTML='<div class="card empty">Die Mannschaftsdaten konnten nicht geladen werden.</div>';return}let done=[...(t.matches||[])].sort((a,b)=>(String(b.date||'')+String(b.time||'')).localeCompare(String(a.date||'')+String(a.time||''))),last=done[0];document.querySelector('#app').innerHTML=nextCard(t.next_game)+lastCard(last)+`<h2 class="section-title">TABELLE</h2>${tableHtml(S.data.tables?.[S.team])}<h2 class="section-title">ALLE SPIELTERMINE</h2>${fixturesHtml(t.fixtures||[])}`;updateCountdowns();bindFixtureAccordions()}
document.querySelector('.team-tabs').addEventListener('click',ev=>{let b=ev.target.closest('[data-team]');if(!b)return;document.querySelectorAll('[data-team]').forEach(x=>x.classList.toggle('active',x===b));S.team=b.dataset.team;render()});

const cals=[['1. Herren','rsv-regionalliga.ics'],['U23','rsv-u23.ics'],['U21','rsv-u21.ics'],['U19','rsv-u19.ics']];function calendarCard(n,f){let url=new URL(f,location.href).href,google='https://calendar.google.com/calendar/render?cid='+encodeURIComponent(url),webcal=url.replace(/^https?:/,'webcal:');return`<article class="card cal"><h2>${n}</h2><p>Einmal abonnieren – spätere Spielverlegungen, neue Termine und Ergebnisse werden automatisch übernommen.</p><a class="btn primary" href="${google}" target="_blank" rel="noopener">Google Kalender</a><a class="btn" href="${webcal}">Apple / iPhone / Mac</a><a class="btn" href="${url}" target="_blank" rel="noopener">Outlook / ICS öffnen</a><button class="btn" data-copy="${url}">Kalender-URL kopieren</button><code class="cal-url">${url}</code></article>`}document.querySelector('#calendars').innerHTML=`<article class="card calendar-help"><h3>Wichtig</h3><p>Bitte den Kalender abonnieren und nicht nur einmalig importieren. In Google Kalender kannst du die kopierte URL über „Weitere Kalender“ → „+“ → „Per URL“ hinzufügen.</p></article>`+cals.map(([n,f])=>calendarCard(n,f)).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.copy).then(()=>toast('Kalender-URL kopiert')));function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}
let tog=document.querySelector('#theme'),meta=document.querySelector('#theme-color');function setTheme(x){document.documentElement.dataset.theme=x;tog.setAttribute('aria-checked',x==='dark');meta.content=x==='dark'?'#080808':'#0759a6';localStorage.setItem('rsv-theme',x)}setTheme(localStorage.getItem('rsv-theme')||'light');tog.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setInterval(updateCountdowns,1000);fetch('/api/site-data',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).catch(()=>fetch('site-data.json',{cache:'no-store'}).then(r=>r.json())).then(d=>{S.data=d;render()}).catch(()=>document.querySelector('#app').innerHTML='<div class="card empty">Spieldaten konnten nicht geladen werden.</div>');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
