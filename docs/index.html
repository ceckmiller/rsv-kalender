<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RSV Eintracht 1949</title>
<meta name="theme-color" content="#0759a6" id="theme-color"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="site.webmanifest"><link rel="icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--blue:#0759a6;--blue2:#0878d2;--bg:#f5f8fc;--card:#fff;--ink:#102d55;--muted:#687a91;--line:#d7e3f1;--shadow:0 8px 26px rgba(11,58,111,.09);--nav-h:72px}
html[data-theme=dark]{--bg:#090909;--card:#131313;--ink:#f4f1e8;--muted:#bbb3a2;--line:#40371f;--shadow:0 10px 30px rgba(0,0,0,.38);--blue:#cda328;--blue2:#e6c256}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));transition:.25s}button,a{font:inherit}.wrap{width:min(980px,calc(100% - 24px));margin:auto}
header{background:linear-gradient(120deg,#07519a,#0879d2);color:#fff;padding:22px 0 26px}html[data-theme=dark] header{background:#080808;color:#d6ad35}.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{grid-column:2;text-align:center}.brand img{display:block;width:132px;height:88px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;margin:auto}.brand h1{font-size:clamp(1.18rem,3.8vw,1.55rem);font-weight:650;letter-spacing:.005em;margin:12px 0 0;white-space:nowrap}.theme{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px}.toggle{width:52px;height:29px;border:1.5px solid currentColor;border-radius:99px;background:rgba(255,255,255,.22);padding:3px;cursor:pointer}.toggle:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.22s}.toggle[aria-checked=true]:after{transform:translateX(23px);background:#d6ad35}
main{padding:18px 0 30px}.view[hidden]{display:none}.team-tabs{display:flex;gap:8px;overflow:auto;margin:2px 0 16px;padding-bottom:4px}.team-tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:600}.team-tabs .active{background:var(--blue);color:#fff;border-color:var(--blue)}html[data-theme=dark] .team-tabs .active{color:#090909}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 11px;border-bottom:1px solid var(--line);font-size:1rem;font-weight:700;color:var(--blue)}.card-head small{font-weight:500;color:var(--muted)}
.hero{padding:16px 18px 20px;text-align:center}.meta{font-size:.82rem;color:var(--muted);font-weight:500}.match-grid{display:grid;grid-template-columns:1fr minmax(85px,.55fr) 1fr;align-items:center;gap:10px;margin-top:14px}.side{min-width:0;font-size:.95rem;font-weight:650}.side img,.logo-fallback{width:72px;height:62px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;display:grid;place-items:center;margin:0 auto 8px;font-weight:800;color:#315172}.side-name{overflow-wrap:normal;word-break:normal;hyphens:none}.kickoff{font-size:2.35rem;line-height:1;color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums}.date{font-size:.84rem;color:var(--muted);margin-bottom:7px}.venue{margin-top:18px;color:var(--muted);font-size:.86rem}.weather-preview{margin-top:8px;color:var(--muted);font-size:.83rem}
.last summary{list-style:none;cursor:pointer}.last summary::-webkit-details-marker{display:none}.last .card-head .arrow{transition:.2s}.last[open] .arrow{transform:rotate(180deg)}.result{font-size:2.8rem;line-height:.95;color:var(--blue);font-weight:650;font-variant-numeric:tabular-nums}.half{font-size:1.05rem;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}.goals{width:min(600px,100%);margin:17px auto 4px;display:grid;gap:4px}.goal{display:grid;grid-template-columns:minmax(0,1fr) 48px 56px 48px minmax(0,1fr);align-items:center;min-height:25px;font-size:.78rem;font-variant-numeric:tabular-nums}.gs{grid-column:3;text-align:center;font-size:.94rem;font-weight:700;color:var(--ink)}.gh{grid-column:1;text-align:right}.ghm{grid-column:2;text-align:right;color:var(--muted);padding-right:6px}.gam{grid-column:4;text-align:left;color:var(--muted);padding-left:6px}.ga{grid-column:5;text-align:left}.details{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);margin-top:16px}.detail{padding:14px 7px;min-width:0;text-align:center;border-right:1px solid var(--line);color:var(--ink);text-decoration:none}.detail:last-child{border-right:0}.ico{font-size:1.45rem;color:var(--blue);display:block;margin-bottom:5px}.dval{font-size:.85rem;font-weight:650}.dlab{font-size:.7rem;color:var(--muted);margin-top:3px}.last-body{animation:reveal .24s ease both}@keyframes reveal{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.section-title{margin:24px 5px 10px;color:var(--blue);font-size:1rem;font-weight:700}.compact{padding:0 14px}.row{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr) 18px;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rteam{display:flex;align-items:center;gap:7px;min-width:0;font-size:.78rem;font-weight:520}.rteam.away{justify-content:flex-end;text-align:right}.rteam img,.tiny-logo{width:30px;height:27px;object-fit:contain;background:#fff;border-radius:5px;padding:2px;flex:none}.rscore{text-align:center;font-size:1.05rem;font-weight:650;font-variant-numeric:tabular-nums}.rhalf{font-size:.68rem;color:var(--muted);margin-top:2px}.rmeta{display:block;color:var(--muted);font-size:.67rem;margin-bottom:3px;font-weight:450}.chev{color:var(--blue);font-size:1.35rem}
.tablebox{overflow:auto}.tablebox table{border-collapse:collapse;width:100%;min-width:580px;font-size:.78rem}.tablebox th,.tablebox td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.tablebox th{color:var(--muted);font-weight:600}.tableteam{display:flex;align-items:center;gap:7px}.fixtures .row{grid-template-columns:95px minmax(0,1fr) 55px}.ftype{font-size:.72rem;font-weight:650}.fdate{font-size:.68rem;color:var(--muted);margin-top:3px}.pair{display:grid;gap:5px}.pair .rteam{font-size:.78rem}.empty{padding:22px;text-align:center;color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cal{padding:18px}.cal h2{font-size:1.05rem;margin:0 0 7px}.cal p{color:var(--muted);font-size:.82rem}.btn{display:block;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;text-decoration:none;color:var(--ink);font-weight:650;margin-top:8px}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.site-footer{background:#0759a6;color:#fff;text-align:center;padding:25px 12px 30px}html[data-theme=dark] .site-footer{background:#0759a6;color:#fff}.site-footer img{width:76px;height:52px;object-fit:contain;background:#fff;border-radius:9px;padding:4px}.site-footer strong{display:block;margin-top:7px;font-weight:650}.site-footer span{font-size:.78rem;opacity:.88}
.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0759a6;color:#fff;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 -7px 20px rgba(0,0,0,.16)}html[data-theme=dark] .bottom-nav{background:#0759a6;color:#fff}.navitem{border:0;background:transparent;color:inherit;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;font-size:.76rem;opacity:.78}.navitem b{font-size:1.25rem;font-weight:400}.navitem.active{opacity:1;font-weight:700}.navitem.active:before{content:"";position:absolute;top:0;width:56px;height:3px;background:#fff;border-radius:0 0 4px 4px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:99px;display:none;z-index:30;font-size:.8rem}
@media(max-width:700px){.wrap{width:min(100% - 16px,980px)}header{padding:16px 0 20px}.brand img{width:105px;height:70px}.theme{gap:4px}.theme>span{font-size:.95rem}.match-grid{grid-template-columns:1fr 78px 1fr}.side img,.logo-fallback{width:62px;height:52px}.kickoff{font-size:2rem}.details{grid-template-columns:repeat(5,minmax(68px,1fr));overflow-x:auto}.detail{min-width:68px}.calendar-grid{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr) 52px minmax(0,1fr) 14px}.rteam{font-size:.72rem}.goal{grid-template-columns:minmax(0,1fr) 39px 48px 39px minmax(0,1fr);font-size:.7rem}.gs{font-size:.86rem}}
</style></head>
<body>
<header><div class="wrap head"><div class="brand"><img src="assets/rsv-logo.png" alt="RSV Eintracht 1949"><h1>RSV Eintracht 1949</h1></div><div class="theme"><span>☀</span><button id="theme" class="toggle" aria-label="Tag- und Nachtmodus" aria-checked="false"></button><span>☾</span></div></div></header>
<main class="wrap"><section id="matches-view" class="view"><div class="team-tabs"><button class="active" data-team="regionalliga">1. Herren</button><button data-team="u23">U23</button><button data-team="u21">U21</button></div><div id="app"></div></section><section id="calendar-view" class="view" hidden><div class="section-title">KALENDER ABONNIEREN</div><div id="calendars" class="calendar-grid"></div></section></main>
<footer class="site-footer"><img src="assets/rsv-logo.png" alt="RSV"><strong>RSV Eintracht 1949</strong><span>TRADITION. LEIDENSCHAFT. REGION.</span></footer>
<nav class="bottom-nav"><button class="navitem active" data-view="matches-view"><b>⚽</b>Spieltage &amp; Tabellen</button><button class="navitem" data-view="calendar-view"><b>▣</b>Kalender abonnieren</button></nav><div id="toast" class="toast"></div>
<script>
const S={data:null,team:'regionalliga'};const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fd=d=>{if(!d)return'';return new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))};
const initials=n=>String(n||'?').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
function logo(n,u,cls=''){return u?`<img class="${cls}" src="${e(u)}" alt="Logo ${e(n)}" loading="lazy" onerror="this.outerHTML='<span class=\'logo-fallback ${cls}\'>${e(initials(n))}</span>'">`:`<span class="logo-fallback ${cls}">${e(initials(n))}</span>`}
function type(m){let c=String(m.competition||'').replace(/\s+20\d{2}\/\d{2}$/,'');if(/freundschaft|test/i.test(c))return'Freundschaftsspiel';if(/pokal/i.test(c))return c;if(m.matchday)return`${m.matchday}. Spieltag`;return c||'Spiel'}
function weather(w){if(!w)return'';let a=[];if(w.temperature!=null)a.push(`${Math.round(w.temperature)}°C`);if(w.summary)a.push(w.summary);if(w.rain!=null)a.push(`${w.rain}% Regen`);if(w.wind!=null)a.push(`${Math.round(w.wind)} km/h Wind`);return a.join(' · ')}
function parseGoal(x){if(typeof x==='object')return x;let s=String(x||''),score=(s.match(/\d+\s*:\s*\d+/)||[''])[0].replace(/\s/g,''),minute=(s.match(/(\d+)\.?\s*(?:Min|Minute)?/i)||[])[1]||'',team=(s.match(/\(([^)]+)\)\s*$/)||[])[1]||'';let name=s.replace(/\d+\.?\s*(?:Min(?:ute)?\.?\s*)?[–-]?\s*/i,'').replace(/\s*[–-]\s*\d+\s*:\s*\d+.*/,'').replace(/\s*\([^)]+\)\s*$/,'').trim();return{score,minute,name,team}}
function goals(m){let a=(m.scorers||[]).map(parseGoal).filter(g=>g.score).reverse();return a.length?`<div class="goals">${a.map(g=>{let home=g.team===m.home||(!g.team&&g.side==='home'),away=g.team===m.away||g.side==='away';if(!home&&!away){let [h]=g.score.split(':').map(Number);let prev=a[a.indexOf(g)+1]?.score?.split(':').map(Number)||[0,0];home=h>(prev[0]||0);away=!home}return`<div class="goal">${home?`<span class="gh">${e(g.name)}</span><span class="ghm">${e(g.minute)}′</span>`:''}<span class="gs">${e(g.score)}</span>${away?`<span class="gam">${e(g.minute)}′</span><span class="ga">${e(g.name)}</span>`:''}</div>`}).join('')}</div>`:''}
function teamSide(n,u){return`<div class="side">${logo(n,u)}<div class="side-name">${e(n)}</div></div>`}
function nextCard(m){if(!m)return`<div class="card empty">Noch kein nächstes Spiel veröffentlicht.</div>`;return`<article class="card"><div class="card-head"><span>▣ &nbsp;NÄCHSTES SPIEL</span><small>${e(type(m))}</small></div><div class="hero"><div class="meta">${e(m.competition||'')} · ${e(type(m))}</div><div class="match-grid">${teamSide(m.home,m.home_logo)}<div><div class="date">${e(fd(m.date))}</div><div class="kickoff">${e(m.time||'–')}</div><div class="meta">Uhr</div></div>${teamSide(m.away,m.away_logo)}</div>${m.location?`<div class="venue">⌖ ${e(m.location)}</div>`:''}${weather(m.weather)?`<div class="weather-preview">☀ ${e(weather(m.weather))}</div>`:''}</div></article>`}
function detail(icon,val,label,url){let tag=url?'a':'div';return`<${tag} class="detail"${url?` href="${e(url)}" target="_blank" rel="noopener"`:''}><span class="ico">${icon}</span><div class="dval">${e(val||'–')}</div><div class="dlab">${e(label)}</div></${tag}>`}
function lastCard(m){if(!m)return'';return`<details class="card last" open><summary class="card-head"><span>⚽ &nbsp;LETZTES SPIEL</span><span class="arrow">⌃</span></summary><div class="last-body hero"><div class="meta">${e(m.competition||'')} · ${e(fd(m.date))}</div><div class="match-grid">${teamSide(m.home,m.home_logo)}<div><div class="result">${e(m.result)}</div>${m.halftime_result?`<div class="half">(${e(m.halftime_result)})</div>`:''}</div>${teamSide(m.away,m.away_logo)}</div>${goals(m)}<div class="details">${detail('♙',m.attendance,'Zuschauer')}${detail('⌁',m.referee,'Schiedsrichter')}${detail('☁',weather(m.weather)||'–','Wetter')}${detail('▷','OSTSPORT','',m.youtube_url)}${detail('▤','Offizieller Spielbericht','',m.report_url)}</div></div></details>`}
function compactRow(m){return`<div class="row"><div><span class="rmeta">${e(type(m))} · ${e(fd(m.date))}</span><span class="rteam">${logo(m.home,m.home_logo)}<span>${e(m.home)}</span></span></div><div class="rscore">${e(m.result||'–')}${m.halftime_result?`<div class="rhalf">(${e(m.halftime_result)})</div>`:''}</div><div class="rteam away"><span>${e(m.away)}</span>${logo(m.away,m.away_logo)}</div><span class="chev">›</span></div>`}
function tableHtml(t){if(!t?.rows?.length)return`<div class="card empty">Die Tabelle wird vorbereitet.</div>`;return`<div class="card tablebox"><table><thead><tr><th>Pl.</th><th>Mannschaft</th><th>Sp.</th><th>Tore</th><th>Diff.</th><th>Pkt.</th></tr></thead><tbody>${t.rows.map(r=>`<tr><td>${e(r.position)}</td><td><span class="tableteam">${logo(r.team,r.logo_url,'tiny-logo')} ${e(r.team)}</span></td><td>${e(r.played)}</td><td>${e(r.goals)}</td><td>${e(r.diff)}</td><td><b>${e(r.points)}</b></td></tr>`).join('')}</tbody></table></div>`}
function fixturesHtml(a){return`<div class="card compact fixtures">${a.map(m=>`<div class="row"><div><div class="ftype">${e(type(m))}</div><div class="fdate">${e(fd(m.date))}${m.time?` · ${e(m.time)} Uhr`:''}</div></div><div class="pair"><span class="rteam">${logo(m.home,m.home_logo)} ${e(m.home)}</span><span class="rteam">${logo(m.away,m.away_logo)} ${e(m.away)}</span></div><div class="rscore">${e(m.result||'–')}</div></div>`).join('')}</div>`}
function render(){let t=S.data.teams[S.team],done=[...(t.matches||[])].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),last=done[0],others=done.slice(1);document.querySelector('#app').innerHTML=nextCard(t.next_game)+lastCard(last)+`<h2 class="section-title">WEITERE SPIELE</h2><div class="card compact">${others.length?others.map(compactRow).join(''):'<div class="empty">Noch keine weiteren Ergebnisse.</div>'}</div><h2 class="section-title">TABELLE</h2>${tableHtml(S.data.tables?.[S.team])}<h2 class="section-title">ALLE SPIELTERMINE</h2>${fixturesHtml(t.fixtures||[])}`}
document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-team]').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.team=b.dataset.team;render()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==b.dataset.view)});
const cals=[['1. Herren','rsv-regionalliga.ics'],['U23','rsv-u23.ics'],['U21','rsv-u21.ics']];document.querySelector('#calendars').innerHTML=cals.map(([n,f])=>`<article class="card cal"><h2>${n}</h2><p>Spielplan automatisch im persönlichen Kalender aktuell halten.</p><a class="btn primary" href="${f}">Kalender öffnen</a><button class="btn" data-copy="${f}">Link kopieren</button></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(new URL(b.dataset.copy,location.href).href).then(()=>toast('Kalender-Link kopiert')));function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1700)}
let tog=document.querySelector('#theme'),meta=document.querySelector('#theme-color');function setTheme(x){document.documentElement.dataset.theme=x;tog.setAttribute('aria-checked',x==='dark');meta.content=x==='dark'?'#080808':'#0759a6';localStorage.setItem('rsv-theme',x)}setTheme(localStorage.getItem('rsv-theme')||'light');tog.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
fetch('site-data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{S.data=d;render()}).catch(()=>document.querySelector('#app').innerHTML='<div class="card empty">Spieldaten konnten nicht geladen werden.</div>');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
