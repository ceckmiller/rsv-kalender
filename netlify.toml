[build]
  publish = "docs"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/site-data"
  to = "/.netlify/functions/site-data"
  status = 200

[[redirects]]
  from = "/api/logo"
  to = "/.netlify/functions/logo"
  status = 200

# Serve static ICS files directly. Apple Calendar / webcal clients are unreliable
# with redirects into Netlify Functions, and the blob-backed calendar function
# is not populated by the static publish pipeline.

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
