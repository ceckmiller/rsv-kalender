[build]
  publish = "docs"
  functions = "netlify/functions"
  ignore = "bash scripts/should-netlify-build.sh"

[[redirects]]
  from = "/api/site-data"
  to = "/.netlify/functions/site-data"
  status = 200

[[redirects]]
  from = "/api/logo"
  to = "/.netlify/functions/logo"
  status = 200

# ICS subscriptions are served from Netlify Blobs via the calendar function so
# calendar data can update without triggering a full site deploy.

[[redirects]]
  from = "/rsv-regionalliga.ics"
  to = "/.netlify/functions/calendar?file=rsv-regionalliga.ics"
  status = 200
  force = true

[[redirects]]
  from = "/rsv-u23.ics"
  to = "/.netlify/functions/calendar?file=rsv-u23.ics"
  status = 200
  force = true

[[redirects]]
  from = "/rsv-u21.ics"
  to = "/.netlify/functions/calendar?file=rsv-u21.ics"
  status = 200
  force = true

[[redirects]]
  from = "/rsv-u19.ics"
  to = "/.netlify/functions/calendar?file=rsv-u19.ics"
  status = 200
  force = true

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
