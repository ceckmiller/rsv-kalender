[build]
  command = "npm install --omit=dev && node scripts/netlify-sync-blobs.mjs || true"
  publish = "docs"
  functions = "netlify/functions"
  ignore = "bash scripts/should-netlify-build.sh"

[functions.calendar]
  included_files = ["docs/*.ics"]

[[redirects]]
  from = "/api/site-data"
  to = "/.netlify/functions/site-data"
  status = 200

[[redirects]]
  from = "/api/logo"
  to = "/.netlify/functions/logo"
  status = 200

# ICS files are published as static assets from docs/ (always in sync with deploy).

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline"
    Cache-Control = "no-cache, must-revalidate"
    Access-Control-Allow-Origin = "*"
